name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # Gate the release on the same lint/test jobs as CI — an untested tag must
  # not ship a build.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (wasm32 target)
        run: cargo clippy --all-targets --target wasm32-unknown-unknown -- -D warnings

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo test

  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: wasm-pack build --target web --release

      - name: Verify output files
        run: |
          test -f pkg/scolta_core_bg.wasm
          test -f pkg/scolta_core.js
          test -f pkg/scolta_core.d.ts

      - name: Create release archive
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          tar -czf scolta-core-${VERSION}.tar.gz \
            -C pkg \
            scolta_core_bg.wasm \
            scolta_core.js \
            scolta_core.d.ts \
            scolta_core_bg.wasm.d.ts

      # Fail-closed content sweep of the artifact we are about to publish:
      # rejects any unexpected member (wasm-pack drift cruft) and enforces the
      # WASM size cap. Single source of truth shared with ci.yml.
      - name: Validate release tarball
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ./scripts/validate-tarball.sh scolta-core-${VERSION}.tar.gz

      - name: Extract CHANGELOG entry
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" \
            CHANGELOG.md > release-notes.txt
          cat release-notes.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.txt
          files: scolta-core-*.tar.gz
          fail_on_unmatched_files: true
