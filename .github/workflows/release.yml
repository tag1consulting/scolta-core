name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # Gate the release on the same lint/test jobs as CI — an untested tag must
  # not ship a build.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (wasm32 target)
        run: cargo clippy --all-targets --target wasm32-unknown-unknown -- -D warnings

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo test --locked
      - run: cargo test --locked --no-default-features

  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The versions size-budgets.json is measured against; see ci.yml.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-03
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-wasm-1.98.1-${{ hashFiles('**/Cargo.lock') }}

      - name: Install wasm-pack (pinned)
        run: ./scripts/install-wasm-pack.sh

      - name: Build both artifacts
        run: ./scripts/build.sh

      # scolta-core-<version>.tar.gz keeps the four-file shape every release
      # has shipped; scolta-core-slim-<version>.tar.gz is the opt-in slim one.
      - name: Create release archives
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ./scripts/package-release.sh "$VERSION" .

      # Fail-closed content sweep of the artifacts we are about to publish:
      # rejects any unexpected member (wasm-pack drift cruft) and enforces the
      # runaway caps. Single source of truth shared with ci.yml.
      - name: Validate release tarballs
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ./scripts/validate-tarball.sh scolta-core-${VERSION}.tar.gz
          ./scripts/validate-tarball.sh scolta-core-slim-${VERSION}.tar.gz

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      # Raw, gzip and Brotli budgets on the exact files being published.
      - name: Size budgets
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          npm ci
          npm run measure:size -- --tarball scolta-core-${VERSION}.tar.gz --tarball scolta-core-slim-${VERSION}.tar.gz

      - name: Extract CHANGELOG entry
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" \
            CHANGELOG.md > release-notes.txt
          cat release-notes.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.txt
          files: scolta-core-*.tar.gz
          fail_on_unmatched_files: true
