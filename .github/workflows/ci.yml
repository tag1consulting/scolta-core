name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (wasm32 target)
        run: cargo clippy --all-targets --target wasm32-unknown-unknown -- -D warnings

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo test

  build:
    name: WASM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM
        run: wasm-pack build --target web --release
      - name: Verify output files
        run: |
          test -f pkg/scolta_core_bg.wasm
          test -f pkg/scolta_core.js
          test -f pkg/scolta_core.d.ts
      - name: Check binary size
        run: |
          SIZE=$(wc -c < pkg/scolta_core_bg.wasm)
          echo "WASM size: $SIZE bytes"
          if [ "$SIZE" -gt 512000 ]; then
            echo "::warning::WASM binary exceeds 500KB ($SIZE bytes)"
          fi

  tarball-allowlist:
    name: Release tarball content sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM
        run: wasm-pack build --target web --release

      # Sweep the WHOLE wasm-pack output dir, not just the four files release.yml
      # names. release.yml selects members by name, so wasm-pack drift cruft
      # (package.json, README.md, LICENSE, .gitignore, snippets/ ...) would slip
      # past a name-selected tar unnoticed. Catch any NEW unexpected file here,
      # at PR time, before it can ride along after a wasm-pack upgrade.
      - name: Detect unexpected files in pkg/
        run: |
          # Mirror the allowlist in scripts/validate-tarball.sh.
          ALLOWED="scolta_core_bg.wasm scolta_core.js scolta_core.d.ts scolta_core_bg.wasm.d.ts"
          UNEXPECTED=""
          while IFS= read -r f; do
            name="$(basename "$f")"
            case " $ALLOWED " in
              *" $name "*) ;;
              *) UNEXPECTED="$UNEXPECTED $f" ;;
            esac
          done < <(find pkg -type f | sort)
          if [ -n "$UNEXPECTED" ]; then
            echo "NOTE: wasm-pack also emitted these files into pkg/ (expected:"
            echo "package.json, README.md, LICENSE, .gitignore — NOT shipped):"
            for f in $UNEXPECTED; do echo "  $f"; done
            echo "This is informational; the artifact below is built from the"
            echo "named allowlist only. If wasm-pack starts emitting something new"
            echo "that SHOULD ship, update scripts/validate-tarball.sh."
          fi

      # Build the artifact exactly as release.yml does, then run the same
      # fail-closed validator release.yml runs. PR-time parity: breakage is
      # caught before the tag, not after.
      - name: Build release tarball
        run: |
          tar -czf test-release.tar.gz \
            -C pkg \
            scolta_core_bg.wasm \
            scolta_core.js \
            scolta_core.d.ts \
            scolta_core_bg.wasm.d.ts
      - name: Validate release tarball
        run: ./scripts/validate-tarball.sh test-release.tar.gz

  changelog:
    name: CHANGELOG enforcement
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check CHANGELOG updated
        run: |
          CODE_CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- \
            'src/' 'Cargo.toml' 'tests/' | head -1)
          if [ -n "$CODE_CHANGED" ]; then
            CHANGELOG_CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- CHANGELOG.md)
            if [ -z "$CHANGELOG_CHANGED" ]; then
              echo "FAIL: Code changed but CHANGELOG.md was not updated."
              exit 1
            fi
          fi

  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version format
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "Version: $VERSION"
          echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9]+)?$' || \
            (echo "FAIL: Invalid version format: $VERSION" && exit 1)
          echo "PASS"
