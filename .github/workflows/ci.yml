name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (wasm32 target)
        run: cargo clippy --all-targets --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy (slim feature set)
        run: |
          cargo clippy --all-targets --no-default-features -- -D warnings
          cargo clippy --all-targets --no-default-features --target wasm32-unknown-unknown -- -D warnings
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Type-check the measurement and browser-test tools (strict)
        run: |
          npm ci
          npm run build:tools

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
      - name: Full feature set (the default)
        run: cargo test --locked
      # The slim artifact's build: no regex engine, no AI helper exports. Its
      # sanitizer is the same code, held to the regex crate by the same
      # differential tests, which run here too.
      - name: Slim feature set
        run: cargo test --locked --no-default-features

  build:
    name: WASM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned, with wasm-pack below: size-budgets.json is measured against
      # exactly these versions, and a floating toolchain would move every
      # number under every PR.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-03
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-wasm-1.98.1-${{ hashFiles('**/Cargo.lock') }}
      - name: Install wasm-pack (pinned)
        run: ./scripts/install-wasm-pack.sh
      - name: Build both artifacts
        run: ./scripts/build.sh
      - name: Pack and validate the release tarballs
        run: |
          ./scripts/package-release.sh ci dist
          ./scripts/validate-tarball.sh dist/scolta-core-ci.tar.gz
          ./scripts/validate-tarball.sh dist/scolta-core-slim-ci.tar.gz
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Install the measurement and browser-test tools
        run: npm ci
      - name: Size budgets (raw, gzip, Brotli) on the packed tarballs
        run: npm run measure:size -- --tarball dist/scolta-core-ci.tar.gz --tarball dist/scolta-core-slim-ci.tar.gz
      # The gate has to be able to fail: an artifact grown by 24 kB of
      # incompressible bytes must breach its budget.
      - name: Size budgets reject an inflated artifact
        run: |
          cp -r pkg-slim inflated
          head -c 24000 /dev/urandom >> inflated/scolta_core_slim_bg.wasm
          if npm run -s measure:size -- --artifacts slim --dir inflated > /dev/null 2> breaches.txt; then
            echo "FAIL: measure:size passed an artifact 24 kB over budget"
            exit 1
          fi
          cat breaches.txt
          grep -q "slim: scolta_core_slim_bg.wasm brotli is" breaches.txt
          echo "measure:size rejected the inflated artifact on size, as it must"
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      # Loads both artifacts from the extracted tarballs above, so a member
      # the packager drops fails here, in Chromium, Firefox and WebKit.
      - name: Browser tests
        env:
          SCOLTA_CORE_TARBALLS: dist/scolta-core-ci.tar.gz,dist/scolta-core-slim-ci.tar.gz
        run: npm run test:browser

  tarball-allowlist:
    name: Release tarball content sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-03
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-wasm-1.98.1-${{ hashFiles('**/Cargo.lock') }}
      - name: Install wasm-pack (pinned)
        run: ./scripts/install-wasm-pack.sh
      - name: Build both artifacts
        run: ./scripts/build.sh

      # Sweep the WHOLE wasm-pack output dirs, not just the files
      # package-release.sh names. It selects members by name, so wasm-pack
      # drift cruft (package.json, README.md, LICENSE, .gitignore, snippets/
      # ...) would slip past a name-selected tar unnoticed. Catch any NEW
      # unexpected file here, at PR time, before it can ride along after a
      # wasm-pack upgrade.
      - name: Detect unexpected files in pkg/ and pkg-slim/
        run: |
          # Mirror the allowlists in scripts/validate-tarball.sh.
          ALLOWED="scolta_core_bg.wasm scolta_core.js scolta_core.d.ts scolta_core_bg.wasm.d.ts scolta_core_slim_bg.wasm scolta_core_slim.js scolta_core_slim.d.ts scolta_core_slim_bg.wasm.d.ts"
          UNEXPECTED=""
          while IFS= read -r f; do
            name="$(basename "$f")"
            case " $ALLOWED " in
              *" $name "*) ;;
              *) UNEXPECTED="$UNEXPECTED $f" ;;
            esac
          done < <(find pkg pkg-slim -type f | sort)
          if [ -n "$UNEXPECTED" ]; then
            echo "NOTE: wasm-pack also emitted these files (expected:"
            echo "package.json, README.md, LICENSE — NOT shipped):"
            for f in $UNEXPECTED; do echo "  $f"; done
            echo "This is informational; the artifacts below are built from the"
            echo "named allowlists only. If wasm-pack starts emitting something new"
            echo "that SHOULD ship, update scripts/validate-tarball.sh."
          fi

      # The default artifact's shape, exactly as every release has shipped
      # it and as downstream updaters expect it, then both tarballs as
      # release.yml packs them, through the same fail-closed validator.
      - name: Build release tarballs
        run: |
          tar -czf test-release.tar.gz \
            -C pkg \
            scolta_core_bg.wasm \
            scolta_core.js \
            scolta_core.d.ts \
            scolta_core_bg.wasm.d.ts
          ./scripts/package-release.sh test dist
      - name: Validate release tarballs
        run: |
          ./scripts/validate-tarball.sh test-release.tar.gz
          cmp <(tar -tzf test-release.tar.gz | sort) <(tar -tzf dist/scolta-core-test.tar.gz | sort)
          ./scripts/validate-tarball.sh dist/scolta-core-test.tar.gz
          ./scripts/validate-tarball.sh dist/scolta-core-slim-test.tar.gz

  changelog:
    name: CHANGELOG enforcement
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check CHANGELOG updated
        run: |
          CODE_CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- \
            'src/' 'Cargo.toml' 'Cargo.lock' 'tests/' 'tools/' 'scripts/' 'package.json' | head -1)
          if [ -n "$CODE_CHANGED" ]; then
            CHANGELOG_CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- CHANGELOG.md)
            if [ -z "$CHANGELOG_CHANGED" ]; then
              echo "FAIL: Code changed but CHANGELOG.md was not updated."
              exit 1
            fi
          fi

  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version format
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "Version: $VERSION"
          echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9]+)?$' || \
            (echo "FAIL: Invalid version format: $VERSION" && exit 1)
          echo "PASS"
